[project]
name = "arbitrage-pipeline"
version = "0.1.0"
description = "Multi-source retail price arbitrage pipeline"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.60.0",
    "playwright-stealth>=2.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.6",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = "playwright_stealth.*"
ignore_missing_imports = true